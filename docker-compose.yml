services:
  nayancare-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nayancare-web:latest
    container_name: nayancare-web
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENABLE_SSL: ${SMTP_ENABLE_SSL:-true}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NayanCare Website}
      SMTP_TO_ADDRESS: ${SMTP_TO_ADDRESS}
      SMTP_SEND_CONFIRMATION: ${SMTP_SEND_CONFIRMATION:-true}
    restart: unless-stopped
